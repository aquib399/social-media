name: CI Checks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      PRISMA_DISABLE_WARNINGS: ${{ secrets.PRISMA_DISABLE_WARNINGS }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
      UPLOADTHING_SECRET_KEY: ${{ secrets.UPLOADTHING_SECRET_KEY }}
      UPLOADTHING_TOKEN: ${{ secrets.UPLOADTHING_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GIT_CLIENT_ID: ${{ secrets.GIT_CLIENT_ID }}
      GIT_CLIENT_SECRET: ${{ secrets.GIT_CLIENT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "18.18.0"

      - name: Install dependencies
        run: npm install --legacy-peer-deps --force

      - name: Debug Environment Variables
        run: |
          echo "Checking environment variables..."
          for var in NEXT_PUBLIC_SITE_URL PRISMA_DISABLE_WARNINGS CRON_SECRET DATABASE_URL DIRECT_DATABASE_URL UPLOADTHING_SECRET_KEY UPLOADTHING_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GIT_CLIENT_ID GIT_CLIENT_SECRET; do
            if [ -z "${!var}" ]; then
              echo "ERROR: $var is not set!"
              exit 1
            fi
          done
          echo "All required secrets are set."

      - name: Lint code with ESLint
        run: npm run lint

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Build Next.js app
        run: npm run build
