name: CI Checks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.18.0 # Updated Node.js version

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Step 4: Format code using Prettier
      - name: Format code
        run: npm run format

      # Step 5: Lint code using ESLint
      - name: Lint code
        run: npm run lint

      # Step 6: Check TypeScript types
      - name: TypeScript Type Check
        run: npx tsc --noEmit

      # Step 7: Build the application
      - name: Build Next.js
        run: npm run build
